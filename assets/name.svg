<svg viewBox="0 0 800 90" width="800"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Text gradient --> <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0"> <stop offset="0%" stop-color="#7dd3fc"/> <stop offset="50%" stop-color="#38bdf8"/> <stop offset="100%" stop-color="#bae6fd"/> </linearGradient> <!-- Cinematic wind color --> <linearGradient id="windColor" x1="0" y1="0" x2="1" y2="0"> <stop offset="0%" stop-color="#e0f7ff" stop-opacity="0.95" /> <stop offset="100%" stop-color="#bfeeff" stop-opacity="0.6" /> </linearGradient> <!-- Cinematic wind filter (soft blur + gentle turbulence displacement) --> <filter id="cinematicWind" x="-40%" y="-40%" width="180%" height="180%"> <feGaussianBlur stdDeviation="1.6" result="blur"/> <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="2" seed="11" result="noise"/> <feDisplacementMap in="blur" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/> </filter> <!-- Particle glow filter (soft halo to make particles pop) --> <filter id="particleGlow" x="-40%" y="-40%" width="200%" height="200%"> <feGaussianBlur stdDeviation="2.8" result="gblur"/> <feMerge> <feMergeNode in="gblur"/> <feMergeNode in="SourceGraphic"/> </feMerge> </filter> </defs> <!-- Background (transparent for embedding on any theme) --> <rect width="100%" height="100%" fill="transparent"/> <!-- Cinematic particle wind (dense particles for cinematic feel) --> <g id="cinematic-wind" filter="url(#cinematicWind)" opacity="0.95" transform="translate(0,18)"> <!-- Many small particles drifting across the banner (denser, strongly non-linear motion) --> <g id="particles" filter="url(#particleGlow)" opacity="1"> <!-- particle A: multi-stop non-linear path with spline easing + wobble --> <circle cx="-40" cy="20" r="1.3" fill="#e6fbff" stroke="#bfeeff" stroke-opacity="0.8" stroke-width="0.18" opacity="0.98"> <animate attributeName="cx" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.14;0.34;0.52;0.72;0.9;1" keySplines="0.3 0 0.7 1;0.5 0 0.2 1;0.4 0 0.6 1;0.6 0 0.2 1;0.3 0 0.8 1;0.5 0 0.5 1" values="-40;20;140;80;360;600;840"/> <animate attributeName="cy" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.16;0.36;0.56;0.76;0.92;1" keySplines="0.4 0 0.6 1;0.2 0 0.8 1;0.7 0 0.3 1;0.3 0 0.7 1;0.5 0 0.5 1;0.4 0 0.6 1" values="20;6;38;28;62;24;20"/> <animate attributeName="r" dur="9s" values="1.3;1.9;1.2;1.5;1.3" repeatCount="indefinite"/> <animate attributeName="opacity" values="0.12;0.98;0.12" dur="11s" repeatCount="indefinite"/> <animateTransform attributeName="transform" type="translate" values="0 0; 6 -4; -4 6; 8 -6; 0 0" dur="5.2s" repeatCount="indefinite" additive="sum"/> </circle> <!-- particle B --> <circle cx="-60" cy="40" r="1.7" fill="#dff7ff" stroke="#c0f0ff" stroke-opacity="0.78" stroke-width="0.2" opacity="0.92"> <animate attributeName="cx" dur="13s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.12;0.3;0.48;0.66;0.86;1" keySplines="0.6 0 0.2 1;0.3 0 0.7 1;0.5 0 0.4 1;0.2 0 0.8 1;0.6 0 0.4 1;0.4 0 0.6 1" values="-60;40;220;120;420;660;820" begin="0.4s"/> <animate attributeName="cy" dur="13s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.14;0.34;0.54;0.74;0.92;1" keySplines="0.4 0 0.6 1;0.5 0 0.5 1;0.2 0 0.8 1;0.6 0 0.4 1;0.3 0 0.7 1;0.5 0 0.5 1" values="40;22;48;32;56;40;40" begin="0.4s"/> <animate attributeName="r" dur="10.6s" values="1.7;2.4;1.5;1.8;1.7" repeatCount="indefinite"/> <animate attributeName="opacity" values="0.15;0.92;0.15" dur="13s" repeatCount="indefinite" begin="0.4s"/> <animateTransform attributeName="transform" type="translate" values="0 0; -8 6; 6 -5; -4 6; 0 0" dur="6.1s" repeatCount="indefinite" additive="sum"/> </circle> <!-- particle C with a subtle curved motion using animateMotion as extra non-linear layer --> <circle cx="-100" cy="28" r="1.05" fill="#eafcff" stroke="#cfeeff" stroke-opacity="0.62" stroke-width="0.14" opacity="0.9"> <animate attributeName="cx" dur="9.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.18;0.38;0.58;0.78;1" keySplines="0.4 0 0.6 1;0.6 0 0.4 1;0.3 0 0.7 1;0.5 0 0.5 1;0.4 0 0.6 1" values="-100;60;300;220;540;800" begin="0.9s"/> <animate attributeName="cy" dur="9.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.16;0.36;0.56;0.76;1" keySplines="0.3 0 0.7 1;0.5 0 0.5 1;0.6 0 0.4 1;0.2 0 0.8 1;0.4 0 0.6 1" values="28;14;36;26;40;28" begin="0.9s"/> <animate attributeName="r" dur="8.4s" values="1.05;1.6;0.95;1.2;1.05" repeatCount="indefinite"/> <animate attributeName="opacity" values="0.1;0.9;0.1" dur="9.6s" repeatCount="indefinite" begin="0.9s"/> <animateMotion dur="9.6s" repeatCount="indefinite" path="M -100 28 C -20 6, 140 40, 300 220 S 560 80, 800 28" begin="0.9s"/> </circle> <!-- particle D --> <circle cx="-20" cy="52" r="1.85" fill="#cfefff" stroke="#bfefff" stroke-opacity="0.8" stroke-width="0.18" opacity="0.96"> <animate attributeName="cx" dur="15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.13;0.29;0.47;0.63;0.82;1" keySplines="0.3 0 0.7 1;0.4 0 0.6 1;0.6 0 0.4 1;0.2 0 0.8 1;0.5 0 0.4 1;0.3 0 0.7 1" values="-20;100;360;240;600;700;820" begin="0.25s"/> <animate attributeName="cy" dur="15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.14;0.32;0.52;0.72;0.9;1" keySplines="0.5 0 0.3 1;0.3 0 0.7 1;0.6 0 0.4 1;0.4 0 0.6 1;0.2 0 0.8 1;0.5 0 0.5 1" values="52;40;66;50;70;56;52" begin="0.25s"/> <animate attributeName="r" dur="12s" values="1.85;2.6;1.5;1.85" repeatCount="indefinite"/> <animate attributeName="opacity" values="0.18;0.96;0.18" dur="15s" repeatCount="indefinite" begin="0.25s"/> <animateTransform attributeName="transform" type="translate" values="0 0; 10 -8; -6 10; 8 -8; 0 0" dur="6.2s" repeatCount="indefinite" additive="sum"/> </circle> <!-- particle E --> <circle cx="-220" cy="36" r="1.45" fill="#dff7ff" stroke="#bfefff" stroke-opacity="0.7" stroke-width="0.16" opacity="0.9"> <animate attributeName="cx" dur="12.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.11;0.27;0.42;0.63;0.84;1" keySplines="0.5 0 0.3 1;0.4 0 0.6 1;0.2 0 0.8 1;0.6 0 0.4 1;0.3 0 0.7 1;0.5 0 0.5 1" values="-220;40;320;200;560;720;840" begin="0.6s"/> <animate attributeName="cy" dur="12.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.33;0.53;0.73;0.9;1" keySplines="0.4 0 0.6 1;0.3 0 0.7 1;0.6 0 0.4 1;0.2 0 0.8 1;0.5 0 0.5 1;0.4 0 0.6 1" values="36;20;46;32;58;36;36" begin="0.6s"/> <animate attributeName="r" dur="11s" values="1.45;2.1;1.1;1.45" repeatCount="indefinite"/> <animate attributeName="opacity" values="0.15;0.9;0.15" dur="12.8s" repeatCount="indefinite" begin="0.6s"/> <animateTransform attributeName="transform" type="translate" values="0 0; -10 6; 8 -6; -4 8; 0 0" dur="6.8s" repeatCount="indefinite" additive="sum"/> </circle> <!-- small shimmer dots (subtle, randomized splines) --> <circle cx="-18" cy="32" r="0.9" fill="#eafcff" opacity="0.7"> <animate attributeName="cx" dur="9.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.2;0.44;0.66;0.86;1" keySplines="0.3 0 0.7 1;0.5 0 0.3 1;0.4 0 0.6 1;0.2 0 0.8 1;0.5 0 0.5 1" values="-18;80;260;420;640;820" begin="0.22s"/> <animate attributeName="cy" dur="9.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.16;0.34;0.56;0.76;1" keySplines="0.4 0 0.6 1;0.3 0 0.7 1;0.5 0 0.5 1;0.6 0 0.4 1;0.3 0 0.7 1" values="32;20;42;30;46;32" begin="0.22s"/> <animate attributeName="opacity" values="0.1;0.7;0.1" dur="9.2s" repeatCount="indefinite"/> </circle> <!-- cinematic glow hints --> <circle cx="-180" cy="30" r="3.4" fill="#dff7ff" opacity="0.06"> <animate attributeName="cx" values="-180;40;260;520;820" dur="18s" repeatCount="indefinite"/> <animate attributeName="cy" values="30;34;28;32;30" dur="16s" repeatCount="indefinite"/> <animate attributeName="opacity" values="0.02;0.06;0.02" dur="18s" repeatCount="indefinite"/> </circle> </g> </g>

  <text x="50%" y="90%"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial"
        font-size="90"
        font-weight="900"
        fill="url(#textGrad)">
    Chetan Chaudhari
  </text>

</svg>
